spring.application.name=icn-subway-server
server.address=127.0.0.1
server.port=8097

# H2 파일 DB (프로젝트 폴더의 data/, Git 제외). 초기화는 docs/data-model.md '보존과 초기화'
spring.datasource.url=jdbc:h2:file:./data/icn-subway
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 정하지 않은 JSON 항목(status, ownerId ...)은 400
spring.jackson.deserialization.fail-on-unknown-properties=true
# JSON 응답에 charset=UTF-8을 붙인다(앱이 한글을 latin1로 읽지 않도록)
spring.servlet.encoding.force-response=true

# JWT: HS256, 1800초. 키는 JWT_SECRET(Base64, 32바이트 이상) 또는 data/.jwt-secret(처음 실행 때 생성)
app.jwt.issuer=skilltransfer-ch07
app.jwt.ttl-seconds=1800
app.jwt.secret=${JWT_SECRET:}
app.jwt.secret-file=./data/.jwt-secret
