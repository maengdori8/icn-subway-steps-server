openapi: 3.0.3
info:
  title: ICN Subway Steps API
  version: 1.0.0
  description: |
    인천공항 T1 입국장 → 서울역행 공항철도(AREX) 탑승까지 단계 안내와 단계별 팁 API.
    교재 7장 방식(Spring Boot 4.1.1 · H2 · JWT HS256)을 따르고 분실물(items) 대신 경로·단계·팁 도메인을 쓴다.
    이 파일이 계약의 기준이다. 사람이 읽는 풀이는 docs/api-reference.md, 자동 테스트 예시는 docs/api-examples/에 있다.

    권한 요약
    - 공개: GET /api/routes, GET /api/routes/{route}/steps, GET /api/tips, GET /api/tips/{id}, POST /api/auth/*
    - 인증: POST /api/tips, GET /api/me/tips
    - 인증 + 올린 사람: PATCH /api/tips/{id}/status (다른 사용자는 403)
    - 계약 밖 점검용(paths에 넣지 않음, 앱은 쓰지 않음): GET /(text/plain 안내 문구), GET /api/health(200 {status: UP, project}).
      둘 다 공개이고, 무효 Authorization 헤더가 붙으면 401 UNAUTHORIZED다.

    공통 규칙 (적용되는 곳을 함께 적는다)
    - JSON 필드 이름은 camelCase다. 문자 인코딩은 UTF-8.
    - Authorization 헤더가 없으면 익명으로 처리한다. 공개 GET은 입력과 대상에 따라 200·400·404다.
      헤더가 있으면 /api/auth/**를 뺀 모든 요청(공개 GET 포함)에서 유효한 Bearer 토큰이어야 하고, 아니면 401 UNAUTHORIZED다.
      /api/auth/signup·/api/auth/login은 Authorization 헤더를 보지 않는다(오래된 토큰이 붙어도 가입·로그인 가능).
    - 401은 두 가지다. UNAUTHORIZED는 토큰 문제이며 보안 필터가 컨트롤러보다 먼저 준다.
      LOGIN_FAILED는 POST /api/auth/login에서만, 입력 검사(400)를 통과한 뒤에 준다.
    - JSON 본문 규칙. 본문을 받는 4곳(POST /api/tips, PATCH /api/tips/{id}/status, POST /api/auth/signup, POST /api/auth/login)에만 적용한다.
      - Content-Type이 JSON(application/json, application/*+json)이 아니면 본문이 비어 있어도 415 UNSUPPORTED_MEDIA_TYPE.
        Content-Type이 아예 없으면 본문이 있을 때 415, 본문도 비어 있으면 400 INVALID_REQUEST_BODY.
      - 정하지 않은 항목(status, ownerId, verifiedAt, id 등. 이름은 대소문자를 구분)이 있으면 400 INVALID_REQUEST_BODY(errors.{항목} '허용하지 않는 항목입니다.').
      - 자료형은 스키마대로만 받는다. integer 항목에 실수(3.7)·문자열("3")·배열, string 항목에 숫자·불리언·배열·객체를 보내면
        바꿔 저장하지 않고 400 INVALID_REQUEST_BODY(errors.{항목} '형식이 맞지 않습니다.').
      - 깨진 JSON, 빈 본문(공백뿐인 본문 포함), 본문 전체가 JSON null, JSON 뒤에 붙은 글자는 400 INVALID_REQUEST_BODY(errors {}).
        INVALID_REQUEST_BODY는 첫 문제 하나만 알린다.
      - 본문 객체 안 항목 값의 JSON null은 형식 오류가 아니다. 필수 항목이면 항목 검사에서 400 VALIDATION_FAILED가 된다(note는 null 허용).
        같은 키가 두 번 오면 마지막 값을 쓴다.
    - 쿼리와 경로 변수: 정하지 않은 쿼리 항목은 무시한다. 숫자 형식 오류는 400 VALIDATION_FAILED(errors.step, errors.id)다.
      - 쿼리 step은 앞뒤 공백(Java String.trim: ASCII 공백·탭·줄바꿈)을 지우고 10진 정수로 읽는다(+4·04도 4, 0x4는 400).
      - 경로 변수 id는 Spring 숫자 변환을 거친다. 가운데를 포함한 공백 문자를 모두 지우고, 0x·0X·#로 시작하면 16진수로 읽는다
        (0x7·%237·%207·+7·007은 모두 7, '1 2'는 12. U+00A0은 공백으로 보지 않아 400). 계약은 10진 정수다(구현 결함, 검토 필요 B4).
    - 앞뒤 공백 제거와 코드 포인트 글자 수(이모지 1개 = 1자)는 POST /api/tips 본문의 title·location·note에만 적용한다.
      공백은 유니코드 White_Space 문자와 U+FEFF다(U+00A0·U+3000·U+0085 포함, 폭 없는 공백 U+200B는 공백이 아님).
      다른 값은 공백을 지우지 않는다. route·status·경로 코드는 그대로 비교한다(대소문자 구분). username은 가입에서 그대로 정규식으로
      검사하고 로그인에서 그대로 찾는다. password는 공백도 글자로 센다. 숫자인 쿼리 step과 경로 id는 위 '쿼리와 경로 변수'대로 읽는다.
    - 오류 응답은 Error 스키마 {code, message, errors}다. 보안 필터·진입점이 쓰는 401·403과, 컨트롤러까지 온 요청에서 ApiAdvice가 바꾼 오류가
      이 모양이다. 스택 추적·SQL·토큰은 넣지 않는다. 다음은 이 모양이 아닐 수 있다(검토 필요 B3, docs/api-reference.md 6절):
      Accept가 JSON을 받지 않는 요청, 보안 방화벽이 거절한 주소(';', '%2F' 등이 든 주소), /error를 직접 부른 요청(Spring Boot 기본 오류 본문),
      보안 필터 안에서 난 예상하지 못한 예외(예: 토큰을 확인하다 난 DB 오류. ApiAdvice를 거치지 않는다).
    - 판단 순서(여러 실패가 겹칠 때): 401 UNAUTHORIZED(토큰) → 400 VALIDATION_FAILED(경로 변수 id 형식) → 415 →
      400 INVALID_REQUEST_BODY(본문 읽기) → 400 VALIDATION_FAILED(항목 검사, 모든 항목을 모아 줌) → 404(대상 없음) → 403(올린 사람 아님).
      로그인의 401 LOGIN_FAILED와 가입의 409 USERNAME_TAKEN은 400 검사 뒤에 판단한다.
    - 선언하지 않은 메서드·경로: 익명이면 401 UNAUTHORIZED다(보안 규칙이 먼저. 공개는 GET만이라 HEAD·OPTIONS도 401).
      예외로 /error(Spring Boot 오류 처리 주소, 모든 메서드를 허용)와 dev 프로필의 /h2-console/**(별도 보안 체인이 모두 허용)는 401이 아니다.
      유효한 토큰이면 404 NOT_FOUND(없는 주소)나 405 METHOD_NOT_ALLOWED(있는 주소의 다른 메서드)다.
      단 /api/auth/** 아래는 필터가 헤더를 보지 않으므로 선언한 POST 두 개 말고는 토큰이 있어도 401이다.
      토큰이 있는 HEAD는 같은 주소의 GET처럼 판단한다(본문 없이 같은 상태 코드). 토큰이 있는 OPTIONS는 선언한 주소 모양이면
      200과 Allow 헤더(없는 팁 번호여도 200), 없는 주소면 404 NOT_FOUND다.
      컨트롤러에서 처리하지 못한 오류는 500 INTERNAL_ERROR, 따로 다루지 않은 그 밖의 Spring MVC 요청 오류는 원래 4xx 상태와 BAD_REQUEST다
      (ApiAdvice가 다루는 범위. 보안 필터 안의 예외는 위 '이 모양이 아닐 수 있다').
servers:
  - url: http://127.0.0.1:8097
    description: 로컬 개발 PC
  - url: http://10.0.2.2:8097
    description: Android 에뮬레이터에서 본 같은 서버
tags:
  - name: routes
  - name: tips
  - name: auth
paths:
  /api/routes:
    get:
      tags: [routes]
      summary: 경로 목록 (S01)
      description: |
        표시 순서대로 준다. T2는 available=false, stepCount=0(준비 중).
        토큰은 쓰지 않는다. 그래도 Authorization 헤더가 붙으면 검사하고, 무효면 401이다(공통 규칙).
      security: []
      responses:
        '200':
          description: 경로 목록
          content:
            application/json:
              schema:
                type: object
                required: [routes]
                properties:
                  routes:
                    type: array
                    items: { $ref: '#/components/schemas/Route' }
              example:
                routes:
                  - code: EXPRESS
                    name: { en: Express Train, ko: 직통열차 }
                    summary: { en: Non-stop to Seoul Station · ticket needed, ko: 서울역까지 무정차 · 승차권 필요 }
                    available: true
                    stepCount: 5
                  - code: LOCAL
                    name: { en: All-stop Train, ko: 일반열차 }
                    summary: { en: Stops at every station · T-money card, ko: 모든 역 정차 · 교통카드(T-money) }
                    available: true
                    stepCount: 5
                  - code: T2
                    name: { en: T2 → Seoul Station, ko: T2 → 서울역 }
                    summary: { en: From T2 arrivals, ko: T2 입국장에서 출발 }
                    available: false
                    stepCount: 0
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/routes/{route}/steps:
    get:
      tags: [routes]
      summary: 한 경로의 단계 목록 (S02)
      description: |
        stepNo 순서로 준다. 준비 중 경로(T2)는 200과 빈 steps(T2에 단계 행이 아직 없음).
        단계 문구는 시안 v03 초안이며 현장 확인 전이다(docs/data-model.md).
        토큰은 쓰지 않는다. 그래도 Authorization 헤더가 붙으면 검사하고, 무효면 404보다 먼저 401이다.
      security: []
      parameters:
        - $ref: '#/components/parameters/RoutePath'
      responses:
        '200':
          description: 단계 목록
          content:
            application/json:
              schema:
                type: object
                required: [route, steps]
                properties:
                  route: { type: string, example: EXPRESS }
                  steps:
                    type: array
                    items: { $ref: '#/components/schemas/Step' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: 없는 경로 코드(대소문자 구분, 공백 제거 없음. express도 404)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: NOT_FOUND, message: 경로를 찾을 수 없습니다., errors: {} }
  /api/tips:
    get:
      tags: [tips]
      summary: 한 단계의 팁 목록 (S02)
      description: |
        id 내림차순(새 팁 먼저). 토큰이 있으면 mine을 판단하고, 없으면 mine은 모두 false.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - name: route
          in: query
          required: true
          description: 안내 중인 경로 코드. 그대로 비교한다(대소문자 구분, 공백 제거 없음).
          schema: { type: string, enum: [EXPRESS, LOCAL] }
        - name: step
          in: query
          required: true
          description: 1부터 그 경로의 stepCount까지의 10진 정수. 앞뒤 공백(ASCII 공백·탭·줄바꿈)은 지우고 읽는다.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 팁 목록(0건이면 빈 배열)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipList' }
        '400':
          description: |
            VALIDATION_FAILED. route와 step의 오류를 함께 모아 준다.
            - errors.route: route가 없음, 안내 중(available)이 아님(T2), 대소문자가 다름, 없는 코드
            - errors.step: 없음·빈 값('단계 번호를 보내세요.'), 정수가 아님(abc, 1.5, int 범위 밖. '단계 번호는 숫자로 보내세요.'),
              범위 밖('1~N 사이의 단계 번호를 보내세요.'). 범위는 route가 맞을 때만 검사한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: VALIDATION_FAILED
                message: 입력값을 확인하세요.
                errors: { step: 1~5 사이의 단계 번호를 보내세요. }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tips]
      summary: 팁 올리기 (S03)
      description: |
        올린 사람(ownerId)은 검증한 토큰의 사용자, status=VERIFIED, verifiedAt=createdAt=지금은 서버가 정한다.
        title·location은 앞뒤 공백을 제거해 저장하고, note는 공백 제거 뒤 빈 값이면 null로 저장한다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TipCreateRequest' }
            example:
              route: LOCAL
              stepNo: 4
              title: 넓은 개찰구
              location: 개찰구 왼쪽 끝
              note: null
      responses:
        '201':
          description: 등록됨
          headers:
            Location:
              description: 새 팁 주소
              schema: { type: string, example: /api/tips/9 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tip' }
        '400':
          description: |
            - VALIDATION_FAILED: 항목 검사(route·stepNo·title·location·note). 모든 항목의 오류를 함께 모아 준다. stepNo 범위는 route가 맞을 때만 검사한다.
            - INVALID_REQUEST_BODY: 정하지 않은 항목, 자료형이 다른 값, 읽을 수 없는 JSON(공통 규칙). 첫 문제 하나만 알린다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인하세요.
                    errors:
                      title: 1~80자로 입력하세요.
                      location: 80자 이하로 입력하세요.
                      note: 150자 이하로 입력하세요.
                unknownField:
                  value:
                    code: INVALID_REQUEST_BODY
                    message: 요청 본문을 읽을 수 없습니다.
                    errors: { status: 허용하지 않는 항목입니다. }
                wrongType:
                  summary: stepNo에 3.7이나 "3", title에 숫자를 보냄
                  value:
                    code: INVALID_REQUEST_BODY
                    message: 요청 본문을 읽을 수 없습니다.
                    errors: { stepNo: 형식이 맞지 않습니다. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/tips/{id}:
    get:
      tags: [tips]
      summary: 팁 하나 (POST의 Location이 가리키는 주소)
      description: 토큰이 있으면 mine을 판단하고, 없으면 mine=false.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TipId'
      responses:
        '200':
          description: 팁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tip' }
        '400': { $ref: '#/components/responses/InvalidTipId' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TipNotFound' }
  /api/tips/{id}/status:
    patch:
      tags: [tips]
      summary: 팁 상태 바꾸기 (S02·S06, 올린 사람만)
      description: |
        status를 바꾸고 verifiedAt을 지금으로 갱신한다. 같은 상태를 다시 보내도 200이며 verifiedAt만 갱신된다(작성자 재확인).
        title·location·note·ownerId·createdAt은 바뀌지 않는다. 권한을 확인하기 전에는 값을 바꾸지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TipId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TipStatusRequest' }
            example: { status: OUTDATED }
      responses:
        '200':
          description: 바뀐 팁
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tip' }
        '400':
          description: |
            팁이 있는지 보기 전에 판단한다(401 다음). 위에서부터 먼저 걸린 것 하나가 나간다.
            - VALIDATION_FAILED errors.id: 경로의 id가 정수가 아님(abc, 1.5) 또는 int64 범위 밖. 본문보다 먼저 본다.
            - INVALID_REQUEST_BODY: 정하지 않은 항목, 문자열이 아닌 status, 빈 본문, 깨진 JSON
            - VALIDATION_FAILED errors.status: status 없음·null·허용하지 않는 값(소문자, 앞뒤 공백이 붙은 값 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: VALIDATION_FAILED
                message: 입력값을 확인하세요.
                errors: { status: VERIFIED 또는 OUTDATED 중 하나를 보내세요. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 올린 사람이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: FORBIDDEN, message: 이 팁을 올린 사람만 상태를 바꿀 수 있습니다., errors: {} }
        '404': { $ref: '#/components/responses/TipNotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/me/tips:
    get:
      tags: [tips]
      summary: 내가 올린 팁 (S06)
      description: id 내림차순. 예시 팁(example=true)도 내 것이면 포함한다(앱에서 거를 수 있음).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 내 팁 목록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/signup:
    post:
      tags: [auth]
      summary: 회원가입
      description: 앱 화면에는 없다(계정 발급 방식 미정). 조회용 사용자 API가 없어 Location 헤더는 주지 않는다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SignupRequest' }
      responses:
        '201':
          description: 가입됨(비밀번호·해시는 응답하지 않음)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400':
          description: |
            - VALIDATION_FAILED: username 형식(공백을 지우지 않고 정규식으로 검사), password 없음·8자(코드 포인트, 공백도 셈) 미만·UTF-8 72바이트 초과. 두 항목을 함께 모아 준다.
            - INVALID_REQUEST_BODY: 정하지 않은 항목(role 등), 문자열이 아닌 값(숫자·불리언), 읽을 수 없는 JSON(공통 규칙)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                validation:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인하세요.
                    errors:
                      username: 소문자 영문·숫자·밑줄 4~24자로 입력하세요.
                      password: 8자 이상, UTF-8 72바이트 이하로 입력하세요.
                unknownField:
                  value:
                    code: INVALID_REQUEST_BODY
                    message: 요청 본문을 읽을 수 없습니다.
                    errors: { role: 허용하지 않는 항목입니다. }
                wrongType:
                  summary: username에 숫자를 보냄
                  value:
                    code: INVALID_REQUEST_BODY
                    message: 요청 본문을 읽을 수 없습니다.
                    errors: { username: 형식이 맞지 않습니다. }
        '409':
          description: 이미 있는 username. 400 검사를 통과한 뒤에 판단한다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: USERNAME_TAKEN, message: 이미 사용 중인 아이디입니다., errors: { username: 이미 사용 중인 아이디입니다. } }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인 (S04)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { username: student01, password: '(표본 비밀번호)' }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400':
          description: |
            - VALIDATION_FAILED: username 없음·빈 값·공백뿐(Java String.isBlank 기준이라 U+00A0만 있는 값은 공백뿐으로 보지 않음), password 없음·빈 값
            - INVALID_REQUEST_BODY: 정하지 않은 항목, 문자열이 아닌 값(숫자·불리언), 읽을 수 없는 JSON(공통 규칙)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                blank:
                  value:
                    code: VALIDATION_FAILED
                    message: 입력값을 확인하세요.
                    errors: { username: 아이디를 입력하세요., password: 비밀번호를 입력하세요. }
                wrongType:
                  summary: password에 불리언을 보냄
                  value:
                    code: INVALID_REQUEST_BODY
                    message: 요청 본문을 읽을 수 없습니다.
                    errors: { password: 형식이 맞지 않습니다. }
        '401':
          description: |
            LOGIN_FAILED. 아이디가 없거나 비밀번호가 다름. UTF-8 72바이트를 넘는 비밀번호는 비교하지 않고 실패다.
            공백뿐인 비밀번호도 빈 값이 아니므로 400이 아니라 이 비교로 간다(그 값으로 가입했다면 200).
            어느 쪽이 틀렸는지 알리지 않는다. 400 검사를 통과한 뒤에 판단한다. 토큰 문제의 401 UNAUTHORIZED와 다른 응답이다.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { code: LOGIN_FAILED, message: 아이디 또는 비밀번호가 맞지 않아요., errors: {} }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Authorization: Bearer <accessToken>. HS256, 발급자 skilltransfer-ch07, 1800초.'
  parameters:
    RoutePath:
      name: route
      in: path
      required: true
      description: 경로 코드. 그대로 비교한다(대소문자 구분, 공백 제거 없음).
      schema: { type: string, enum: [EXPRESS, LOCAL, T2] }
    TipId:
      name: id
      in: path
      required: true
      description: 팁 번호(10진 정수). 읽을 수 없거나 int64 범위 밖이면 400 VALIDATION_FAILED errors.id. 지금 구현은 공백과 16진수(0x7)도 받는다(공통 규칙, 검토 필요 B4)
      schema: { type: integer, format: int64 }
  responses:
    Unauthorized:
      description: |
        토큰 문제(UNAUTHORIZED). 보안 필터가 컨트롤러보다 먼저 판단한다. 앱은 code만 보고 message는 화면에 쓰지 않는다.
        - 보호된 API에 Authorization 헤더가 없음 → '로그인이 필요합니다.'
        - 헤더가 있는데 무효(공개 GET 포함): Bearer가 아님(Basic 등), 빈 토큰, 서명·키·발급자·alg가 다름, 만료,
          exp·iat·username 없음, DB 사용자와 맞지 않음(없는 id, 이름 다름, 계정 생성 전 발급) → '로그인이 만료되었거나 올바르지 않습니다.'
        조건 표는 docs/auth-design.md '401과 403'. 로그인 실패(LOGIN_FAILED)는 이 응답이 아니다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          examples:
            noToken:
              summary: 보호된 API에 헤더 없음
              value: { code: UNAUTHORIZED, message: 로그인이 필요합니다., errors: {} }
            invalidToken:
              summary: 헤더가 있는데 무효·만료(공개 GET 포함)
              value: { code: UNAUTHORIZED, message: 로그인이 만료되었거나 올바르지 않습니다., errors: {} }
    UnsupportedMediaType:
      description: |
        Content-Type이 JSON(application/json, application/*+json)이 아님(본문이 비어 있어도 415). Content-Type이 없으면 본문이 있을 때만 415이고,
        본문도 비어 있으면 415가 아니라 400 INVALID_REQUEST_BODY다. 보호된 API는 401 검사 뒤에 판단한다.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: UNSUPPORTED_MEDIA_TYPE, message: 'Content-Type: application/json 으로 보내세요.', errors: {} }
    TipNotFound:
      description: 없는 팁 번호(0·음수 포함)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: NOT_FOUND, message: 팁을 찾을 수 없습니다., errors: {} }
    InvalidTipId:
      description: id가 정수가 아님(abc, 1.5) 또는 int64 범위를 넘음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { code: VALIDATION_FAILED, message: 입력값을 확인하세요., errors: { id: 형식이 맞지 않습니다. } }
  schemas:
    Text:
      type: object
      required: [en, ko]
      properties:
        en: { type: string }
        ko: { type: string }
    Lines:
      type: object
      required: [en, ko]
      properties:
        en: { type: array, items: { type: string } }
        ko: { type: array, items: { type: string } }
    Route:
      type: object
      required: [code, name, summary, available, stepCount]
      properties:
        code: { type: string, enum: [EXPRESS, LOCAL, T2] }
        name: { $ref: '#/components/schemas/Text' }
        summary: { $ref: '#/components/schemas/Text' }
        available: { type: boolean, description: false면 '준비 중'(누르면 안내만) }
        stepCount: { type: integer, minimum: 0 }
    Step:
      type: object
      required: [stepNo, role, icon, photoKey, sign, title, instructions, elevator]
      properties:
        stepNo: { type: integer, minimum: 1 }
        role:
          type: string
          enum: [HERE, FIND]
          description: HERE = 지금 서 있는 곳(현재 위치), FIND = 찾을 표지판
        icon: { type: string, enum: [PLANE, ESCALATOR, TRAIN] }
        photoKey:
          type: string
          nullable: true
          description: 앱에 들어 있는 사진 키(arrivals, transportCenter, expressConcourse, expressGate, expressPlatform, localConcourse, localGate, localPlatform). null이면 '사진 준비 중'.
        sign:
          type: object
          description: 표지판 글자. 언어 전환과 관계없이 ko·en 병기.
          required: [ko, en]
          properties:
            ko: { type: string }
            en: { type: string }
        title: { $ref: '#/components/schemas/Text' }
        instructions:
          allOf: [{ $ref: '#/components/schemas/Lines' }]
          description: 행동 안내 줄 목록. '{ko|공항철도}'처럼 중괄호 안은 다른 언어로 읽을 부분(앱은 '|' 뒤 글자만 표시).
        elevator:
          allOf: [{ $ref: '#/components/schemas/Text' }]
          nullable: true
          description: "엘리베이터 위치. en·ko가 둘 다 있을 때만 준다. 현장 확인 전이거나 한 언어만 채운 단계는 null → 앱은 '엘리베이터: 현장 확인 중'."
    Tip:
      type: object
      required: [id, route, stepNo, title, location, note, status, verifiedAt, createdAt, ownerId, mine, example]
      properties:
        id: { type: integer, format: int64, description: 서버가 정함 }
        route: { type: string, enum: [EXPRESS, LOCAL] }
        stepNo: { type: integer }
        title: { type: string, description: 1~80 코드 포인트 }
        location: { type: string, description: 1~80 코드 포인트 }
        note: { type: string, nullable: true, description: '0~150 코드 포인트, 없으면 null' }
        status:
          type: string
          enum: [VERIFIED, OUTDATED]
          description: VERIFIED = 작성자 확인, OUTDATED = 작성자가 오래됨 표시
        verifiedAt:
          type: string
          format: date-time
          description: 작성자가 마지막으로 상태를 정한 시각(UTC, 예 2026-10-20T03:00:00Z). 앱은 날짜만 표시.
        createdAt: { type: string, format: date-time }
        ownerId: { type: integer, format: int64, description: 올린 사용자 id. 서버가 토큰으로 정함 }
        mine: { type: boolean, description: 요청한 토큰의 사용자가 올린 팁인지. 토큰이 없으면 false }
        example: { type: boolean, description: 시드 예시 팁이면 true(앱은 '예시' 배지·작성자 '샘플'). 사용자가 올린 팁은 항상 false }
    TipList:
      type: object
      required: [tips]
      properties:
        tips:
          type: array
          items: { $ref: '#/components/schemas/Tip' }
    TipCreateRequest:
      type: object
      additionalProperties: false
      required: [route, stepNo, title, location]
      properties:
        route: { type: string, enum: [EXPRESS, LOCAL], description: 'S02에서 넘어온 값. 그대로 비교(대소문자 구분, 공백 제거 없음)' }
        stepNo: { type: integer, minimum: 1, description: 1~그 경로의 stepCount }
        title: { type: string, description: 앞뒤 공백 제거 후 1~80 코드 포인트 }
        location: { type: string, description: 앞뒤 공백 제거 후 1~80 코드 포인트 }
        note: { type: string, nullable: true, description: '선택. 공백 제거 후 0~150 코드 포인트, 빈 값은 null' }
    TipStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [VERIFIED, OUTDATED], description: '그대로 비교(대소문자 구분, 공백 제거 없음)' }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, pattern: '^[a-z0-9_]{4,24}$', description: 공백을 지우지 않고 이 정규식으로 검사 }
        password: { type: string, description: '8자(코드 포인트) 이상, UTF-8 72바이트 이하. 공백을 지우지 않고 공백도 글자로 센다' }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username: { type: string, description: 없거나 빈 값·공백뿐이면 400. 공백을 지우지 않고 그대로 찾는다 }
        password: { type: string, description: 없거나 빈 값이면 400. 공백뿐인 값은 빈 값이 아니라서 그대로 비교한다 }
    User:
      type: object
      required: [id, username]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, example: 1800, description: 초 }
        user: { $ref: '#/components/schemas/User' }
    Error:
      type: object
      required: [code, message, errors]
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, INVALID_REQUEST_BODY, BAD_REQUEST, UNAUTHORIZED, LOGIN_FAILED, FORBIDDEN, NOT_FOUND,
                 USERNAME_TAKEN, METHOD_NOT_ALLOWED, UNSUPPORTED_MEDIA_TYPE, INTERNAL_ERROR]
        message: { type: string, description: 사람이 읽는 한국어 안내 }
        errors:
          type: object
          additionalProperties: { type: string }
          description: 입력 항목 이름 → 안내 문구(S03 문구). 항목 오류가 없으면 {}.
